services:
  db:
    image: postgres:17-alpine
    container_name: konterkuota-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: konter_user
      POSTGRES_PASSWORD: ${DEV_DB_PASSWORD:?Set DEV_DB_PASSWORD for local development}
      POSTGRES_DB: konterkuota
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U konter_user -d konterkuota"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local

